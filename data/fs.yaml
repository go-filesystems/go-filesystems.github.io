# One card per real, non-fork repo in the go-filesystems org.
#
# ⛔ That sentence was here already, and was false by NINE: cab, overlay, rar,
# rpm, s3, sevenzip, smb, unarchive and warc were in the org and on no page of
# it. A comment promising completeness is not a mechanism for it -- the same
# sentence, almost word for word, sat above an incomplete list in go-fsctl's
# landing and in this org's own profile.
#
# What keeps it true now is go-fleettools/docscan, which compares this file
# against the organisation and fails the build when they disagree. If you add a
# repository and forget this file, CI says so.
#
# kind  = driver | core (shared by the drivers: the contract, and a parser more
#         than one of them needs) | tool (meta-importer, not a format)
# ci    = true when the repo has a working .github/workflows/ci.yml badge.
#         Verified live 2026-09-26 for all 31, by asking each repository for the
#         conclusion of its last completed `ci` run on main:
#           gh api "repos/go-filesystems/$m/actions/workflows/ci.yml/runs\
#                   ?branch=main&status=completed&per_page=1" \
#              --jq '.workflow_runs[0].conclusion // "NO-RUN"'
#         ⛔ The date above used to say 2026-08-05 while eleven cards had been
#         added since, so the sentence covered repositories nobody had checked.
#         A dated claim ages into a false one unless re-measuring is this cheap.
# No coverage badges — the org publishes no coverage gate/badge today.
modules:
  - name: interface
    kind: core
    ci: true
    desc: "The shared <code>filesystem.Filesystem</code> contract every driver implements — Read/Write/List/Stat/MkDir/Rename and friends. No cgo, no root."
  - name: cpio
    kind: core
    ci: true
    desc: "cpio records — newc, crc, odc and the old binary variant, both byte orders. Deliberately <strong>not</strong> a <code>Filesystem</code>: <code>unarchive</code> indexes into a reader it keeps open and <code>rpm</code> has the payload decompressed in memory, so they share the parser and each builds its own filesystem over it. Bounds input-driven allocations: <code>MaxNameSize</code> caps a name, <code>RecordsLimit</code> caps the record list, and an excess is <code>ErrTooLarge</code>."
  - name: hostcopy
    kind: core
    ci: true
    desc: "Copies a byte range from one driver's file into another's without holding it in memory — and without passing it through this process at all when both are files of the host, where it becomes <code>copy_file_range(2)</code>. Anything else falls back to <code>ReadAt</code>/<code>WriteAt</code>, so a caller writes one call and gets the kernel's copy when the kernel can do it."
  - name: detect
    kind: tool
    ci: true
    desc: "blkid-style filesystem-type prober and driver-opener registry — probes on-disk magic signatures and dispatches to a registered driver. No cgo, no libblkid. An image never sizes an allocation here: every probe is a fixed window of at most 8 bytes (64 for the FAT12/16 boot sector) and every read has a 1 MiB ceiling."
  - name: playground
    kind: tool
    ci: true
    desc: "<strong>In-browser playground</strong> — drop a disk image into <a href=\"https://go-filesystems.github.io/playground/\">the page</a>: it says which filesystem it is, lets you browse the tree, view small files and download any file. The drivers run in WebAssembly in a Web Worker; <strong>nothing is uploaded</strong>. No image at hand? It formats a sample FAT32 one in memory."
  - name: sftp
    kind: tool
    ci: true
    desc: "Pure-Go <strong>SFTP server</strong> (draft-ietf-secsh-filexfer-02 v3) exporting any <code>Filesystem</code> over <code>golang.org/x/crypto/ssh</code> — reachable from every ordinary SFTP client (OpenSSH, Cyberduck, WinSCP, FileZilla, VS Code, gvfs) with nothing installed and nothing mounted. Key auth and encryption included; one image plus one process is the isolation boundary. A client-sent offset cannot size an allocation: a whole-file rewrite grows a file by at most 8 MiB past its end and to at most 1 GiB, and answers <code>SSH_FX_FAILURE</code> beyond."
  - name: nfs
    kind: tool
    ci: true
    desc: "NFSv3 server that exports any <code>filesystem.Filesystem</code> — mountable on macOS, Linux and Windows with no kext, no FSKit entitlement and no root on the server side. A network protocol instead of a kernel module. The XDR decoder never allocates on a length it has not first checked, and the RPCSEC_GSS context table is bounded (<code>rpcgss.MaxContexts</code>, default <code>DefaultMaxContexts</code> = 4096)."
  - name: webdav
    kind: tool
    ci: true
    desc: "WebDAV server (RFC 4918) that exports any <code>filesystem.Filesystem</code> as a <code>net/http.Handler</code> — browsable in a browser, mountable from the Finder or Explorer, with Basic/Bearer authentication and TLS. <code>Range</code> reads and <code>Content-Range</code> partial writes go through the random-access capabilities."
  - name: apfs
    kind: driver
    ci: true
    desc: "Apple File System — real APFS on-disk (kext-mountable), GPT-aware. Read, write, format, symlinks, snapshots and container resize. Input-driven allocations are bounded before they are made: file reads by the backing store's real size, sparse holes and decmpfs sizes by 1 GiB (<code>safeio.ErrTooLarge</code>)."
  - name: btrfs
    kind: driver
    ci: true
    desc: "Copy-on-write Linux filesystem with snapshots and subvolumes. Single-device, CRC32c (btrfs-progs ≥ 5.x). Read, write, format. Every allocation sized from the image is checked against what the format can produce first: a compressed extent is at most 128 KiB (the kernel's <code>BTRFS_MAX_UNCOMPRESSED</code>), overlapping extent items are refused."
  - name: exfat
    kind: driver
    ci: true
    desc: "Extended FAT for large removable media. Read, write, format and volume label. Allocations a hostile image can size are bounded before they happen: a cluster buffer is allocated only after its last byte has been read, and a directory is at most 256 MiB."
  - name: ext4
    kind: driver
    ci: true
    desc: "Linux ext4 — extents, 64-bit block numbers, flex_bg, directory htree, journaling, metadata_csum (CRC32c). Read, write, format, symlinks, online grow/shrink. <code>ReadFile</code> is capped at the smaller of the declared filesystem size and <code>DefaultMaxReadSize</code> (1 GiB, <code>SetMaxReadSize</code> changes it) and refused with <code>ErrTooLarge</code>; overlapping extent leaves are refused."
  - name: fat32
    kind: driver
    ci: true
    desc: "FAT with 32-bit allocation — the cross-platform baseline. Read, write, format and volume label; also reads, writes and resizes FAT12 and FAT16 volumes (an in-place resize never changes the FAT type; CopyResized copies a volume into a new image of another size or type). Allocations a hostile image can size are bounded before they happen: a cluster buffer is allocated only after its last byte has been read, and a directory is at most 2 MiB."
  - name: hfsplus
    kind: driver
    ci: true
    desc: "Apple HFS+ / HFSX (Mac OS Extended) — big-endian catalog + extents-overflow B-trees. Read, write, format. A fork's size is bounded by the image size and its extents must lie inside the image before the buffer is made; the B-tree leaf-chain walk is bounded as well."
  - name: iso9660
    kind: driver
    ci: true
    desc: "ISO 9660 / ECMA-119 optical-disc filesystem, plus Rock Ridge (names/perms/symlinks) and Joliet (UCS-2 names). Read-only. A length is bounded by the image size and its extent must lie inside the image; with the size unknown the buffer grows with the bytes delivered and claims above 1 GiB are refused, and a directory extent is at most 16 MiB."
  - name: ntfs
    kind: driver
    ci: true
    desc: "Windows NT filesystem — minimal in-image blob model (NOT the real NTFS on-disk format); a separate read-only real-NTFS reader parses the genuine on-disk structures. Read, write, format and volume label. Bounds input-driven allocations: a data run must lie inside the image, and reads are capped at <code>DefaultMaxDataSize</code> (lowered or raised with <code>SetMaxDataSize</code>)."
  - name: oci
    kind: driver
    ci: true
    desc: "Read-only OCI / Docker image filesystem — overlays an image's tar layers (whiteouts, opaque directories, hardlinks, symlinks) and serves the merged rootfs through the shared contract. Image-as-filesystem, not an on-disk format. Every input-driven allocation is bounded before it happens (<code>DefaultLimits()</code>: manifests 16 MiB, 16 GiB of whole image) and an excess wraps <code>safeio.ErrTooLarge</code>."
  - name: squashfs
    kind: driver
    ci: true
    desc: "Compressed read-only archive filesystem. SquashFS 4.0 with gzip/xz/zstd/lzo/lz4 blocks and fragments. Read and format. <code>ReadFile</code> refuses more than <code>DefaultMaxReadFile</code> (1 GiB) with <code>ErrTooLarge</code>, <code>ReadFileLimit</code> picks another ceiling, and every size the image claims is bounded before it is allocated."
  - name: uefi
    kind: driver
    ci: true
    desc: "EFI System Partition (FAT-based) plus the OVMF/EDK2 NvVar variable store with time-based authenticated writes. Read, write, format. A store file is bounded before it is read: <code>OpenLimits</code> sets <code>MaxFileSize</code> (default 256 MiB) and <code>MaxVariables</code> (default 65 536); an excess wraps <code>safeio.ErrTooLarge</code>."
  - name: ufs
    kind: driver
    ci: true
    desc: "Unix File System (BSD) — UFS2 (FreeBSD 14.x) read+write, UFS1 read. Read, write, format, symlinks. A read is capped at <code>DefaultMaxFileBytes</code> (1 GiB, lowered with <code>SetMaxFileBytes</code>) and fails with <code>ErrTooLarge</code> before anything is allocated."
  - name: ffs
    kind: driver
    ci: true
    desc: "NetBSD/OpenBSD FFSv1/FFSv2 alias module over the ufs driver. Read, write, format. Inherits the ufs bounds on an untrusted image, including the 1 GiB <code>DefaultMaxFileBytes</code> read ceiling."
  - name: xfs
    kind: driver
    ci: true
    desc: "High-performance journaling filesystem — XFS v5 (CRC32c, ftype). Read, write, format, symlinks, reflink/quotas and grow/resize. <code>ReadFile</code> is capped at <code>DefaultMaxReadSize</code> (1 GiB, <code>SetMaxReadSize</code> changes it) and refused with <code>ErrTooLarge</code>; overlapping extent records are refused."
  - name: zfs
    kind: driver
    ci: true
    desc: "Copy-on-write pooled storage filesystem — single pool, single vdev writer (multi-vdev/RAID-Z read-only). Read, write, format, snapshots/clones and grow/shrink. <code>ReadFile</code>/<code>ReadLink</code> are capped at <code>DefaultMaxReadSize</code> (1 GiB, <code>SetMaxReadSize</code> changes it) and refused with <code>ErrTooLarge</code>; block pointer sizes are limited to 16 MiB as OpenZFS does."
  - name: cab
    kind: driver
    ci: true
    desc: "Microsoft Cabinet (<code>.cab</code>), read as a filesystem — no cgo. Every count that sizes an allocation is proved to fit in the file first; <code>ReadFile</code> is capped at <code>MaxReadFileSize</code> (1 GiB, <code>ErrTooLarge</code>)."
  - name: rar
    kind: driver
    ci: true
    desc: "RAR read as a filesystem, including multi-volume sets. Size claims in an archive are bounded by default and raised by naming them: <code>OpenLimits</code> and <code>OpenReaderLimits</code> take a <code>Limits</code>."
  - name: rpm
    kind: driver
    ci: true
    desc: "RPM packages — the lead, the signature and header regions, and the payload. The size the payload inflates to is bounded: <code>OpenLimit</code> sets the ceiling, <code>Open</code> uses <code>DefaultMaxPayload</code> (1 GiB), and an excess is <code>ErrTooLarge</code>."
  - name: sevenzip
    kind: driver
    ci: true
    desc: "7z through <code>bodgit/sevenzip</code>, and it <strong>writes</strong> — the container and the entries."
  - name: warc
    kind: driver
    ci: true
    desc: "WARC, the ISO 28500 web archive format — reader <strong>and</strong> writer. A file is read as hostile: a record's header is capped at <code>MaxHeaderBytes</code> (1 MiB), a block held in memory at <code>MaxBlockSize</code> (default 1 GiB), and an excess is <code>ErrTooLarge</code>."
  - name: unarchive
    kind: tool
    ci: true
    desc: "Extract any archive, everywhere Go compiles: the format is sniffed from the bytes, not the extension, and volumes are followed. Extraction is bounded by default: <code>Options.MaxBytes</code> (64 GiB), <code>MaxEntries</code> (4,194,304) and <code>MaxDepth</code> (1024), and an index by <code>Limits</code>; an excess is <code>ErrTooLarge</code>."
  - name: smb
    kind: tool
    ci: true
    desc: "SMB2 server exporting any <code>Filesystem</code> — mountable on Windows, macOS and Linux. Sizes a client names are bounded before they are allocated: a whole-file rewrite grows a file by at most 8 MiB past its end and to at most 1 GiB, answers <code>STATUS_DISK_FULL</code> beyond, and a negative offset or size is <code>STATUS_INVALID_PARAMETER</code>."
  - name: s3
    kind: tool
    ci: true
    desc: "An S3-compatible object API over any driver here."
  - name: osfs
    kind: driver
    ci: true
    desc: "A host directory as a <code>Filesystem</code>, confined with <code>os.Root</code>. Every other driver here decodes a format out of an image; this one hands each call to the host kernel, relative to one directory, so a server written against the contract can serve a plain directory without a disk image in the way."
  - name: overlay
    kind: tool
    ci: true
    desc: "Makes a read-only filesystem writable: changes land in a spool, cheaply, and one rewrite happens when you say so. The base is untrusted: <code>WithLimits</code> bounds what <code>Seal</code> walks (<code>MaxEntries</code> 4 Mi, <code>MaxDepth</code> 2048) and the spool (<code>MaxSpool</code>); an excess wraps <code>ErrTooLarge</code>."
  - name: xar
    kind: driver
    ci: true
    desc: "XAR, the macOS <code>.pkg</code> installer format: a gzip'd XML table of contents and a heap. Every size the archive claims is checked before it is allocated: <code>OpenReaderWith</code> takes <code>Options</code>, with <code>DefaultMaxEntries</code> (1,048,576) and <code>DefaultMaxFileSize</code> (1 GiB); an excess is <code>ErrTooLarge</code>."
  - name: remote
    kind: tool
    ci: true
    desc: "A <code>Filesystem</code> served over a connection: <code>Serve</code> answers requests against any filesystem, <code>New</code> is that filesystem at the other end, with the same optional interfaces and the same errors — an errno comes back as itself, so <code>errors.Is(err, fs.ErrNotExist)</code> answers as it did on the server. It exists to keep the process that touches the files apart from the one that talks to the network: go-fileshare/fileshare serves a person's files <strong>as that person</strong>, a worker under their uid behind a front that holds no privilege. <code>conn</code> is any <code>io.ReadWriteCloser</code> — a socketpair, a pipe, a TCP connection. The peer is not trusted: a frame is at most <code>MaxFrame</code> (32 MiB), checked before anything is allocated, a server holds at most 4096 files per connection, and a negative offset or truncate size is refused before the driver sees it."
