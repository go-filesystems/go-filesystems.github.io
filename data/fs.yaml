# One card per real, non-fork repo in the go-filesystems org.
#
# ⛔ That sentence was here already, and was false by NINE: cab, overlay, rar,
# rpm, s3, sevenzip, smb, unarchive and warc were in the org and on no page of
# it. A comment promising completeness is not a mechanism for it -- the same
# sentence, almost word for word, sat above an incomplete list in go-fsctl's
# landing and in this org's own profile.
#
# What keeps it true now is go-fleettools/docscan, which compares this file
# against the organisation and fails the build when they disagree. If you add a
# repository and forget this file, CI says so.
#
# kind  = driver | core (shared by the drivers: the contract, and a parser more
#         than one of them needs) | tool (meta-importer, not a format)
# ci    = true when the repo has a working .github/workflows/ci.yml badge.
#         Verified live 2026-09-26 for all 31, by asking each repository for the
#         conclusion of its last completed `ci` run on main:
#           gh api "repos/go-filesystems/$m/actions/workflows/ci.yml/runs\
#                   ?branch=main&status=completed&per_page=1" \
#              --jq '.workflow_runs[0].conclusion // "NO-RUN"'
#         ⛔ The date above used to say 2026-08-05 while eleven cards had been
#         added since, so the sentence covered repositories nobody had checked.
#         A dated claim ages into a false one unless re-measuring is this cheap.
# No coverage badges — the org publishes no coverage gate/badge today.
modules:
  - name: interface
    kind: core
    ci: true
    desc: "The shared <code>filesystem.Filesystem</code> contract every driver implements — Read/Write/List/Stat/MkDir/Rename and friends. No cgo, no root."
  - name: cpio
    kind: core
    ci: true
    desc: "cpio records — newc, crc, odc and the old binary variant, both byte orders. Deliberately <strong>not</strong> a <code>Filesystem</code>: <code>unarchive</code> indexes into a reader it keeps open and <code>rpm</code> has the payload decompressed in memory, so they share the parser and each builds its own filesystem over it."
  - name: detect
    kind: tool
    ci: true
    desc: "blkid-style filesystem-type prober and driver-opener registry — probes on-disk magic signatures and dispatches to a registered driver. No cgo, no libblkid."
  - name: sftp
    kind: tool
    ci: true
    desc: "Pure-Go <strong>SFTP server</strong> (draft-ietf-secsh-filexfer-02 v3) exporting any <code>Filesystem</code> over <code>golang.org/x/crypto/ssh</code> — reachable from every ordinary SFTP client (OpenSSH, Cyberduck, WinSCP, FileZilla, VS Code, gvfs) with nothing installed and nothing mounted. Key auth and encryption included; one image plus one process is the isolation boundary."
  - name: nfs
    kind: tool
    ci: true
    desc: "NFSv3 server that exports any <code>filesystem.Filesystem</code> — mountable on macOS, Linux and Windows with no kext, no FSKit entitlement and no root on the server side. A network protocol instead of a kernel module."
  - name: webdav
    kind: tool
    ci: true
    desc: "WebDAV server (RFC 4918) that exports any <code>filesystem.Filesystem</code> as a <code>net/http.Handler</code> — browsable in a browser, mountable from the Finder or Explorer, with Basic/Bearer authentication and TLS. <code>Range</code> reads and <code>Content-Range</code> partial writes go through the random-access capabilities."
  - name: apfs
    kind: driver
    ci: true
    desc: "Apple File System — real APFS on-disk (kext-mountable), GPT-aware. Read, write, format, symlinks, snapshots and container resize."
  - name: btrfs
    kind: driver
    ci: true
    desc: "Copy-on-write Linux filesystem with snapshots and subvolumes. Single-device, CRC32c (btrfs-progs ≥ 5.x). Read, write, format."
  - name: exfat
    kind: driver
    ci: true
    desc: "Extended FAT for large removable media. Read, write, format and volume label."
  - name: ext4
    kind: driver
    ci: true
    desc: "Linux ext4 — extents, 64-bit block numbers, flex_bg, directory htree, journaling, metadata_csum (CRC32c). Read, write, format, symlinks, online grow/shrink."
  - name: fat32
    kind: driver
    ci: true
    desc: "FAT with 32-bit allocation — the cross-platform baseline. Read, write, format and volume label."
  - name: hfsplus
    kind: driver
    ci: true
    desc: "Apple HFS+ / HFSX (Mac OS Extended) — big-endian catalog + extents-overflow B-trees. Read, write, format."
  - name: iso9660
    kind: driver
    ci: true
    desc: "ISO 9660 / ECMA-119 optical-disc filesystem, plus Rock Ridge (names/perms/symlinks) and Joliet (UCS-2 names). Read-only."
  - name: ntfs
    kind: driver
    ci: true
    desc: "Windows NT filesystem — minimal in-image blob model (NOT the real NTFS on-disk format); a separate read-only real-NTFS reader parses the genuine on-disk structures. Read, write, format and volume label."
  - name: oci
    kind: driver
    ci: true
    desc: "Read-only OCI / Docker image filesystem — overlays an image's tar layers (whiteouts, opaque directories, hardlinks, symlinks) and serves the merged rootfs through the shared contract. Image-as-filesystem, not an on-disk format."
  - name: squashfs
    kind: driver
    ci: true
    desc: "Compressed read-only archive filesystem. SquashFS 4.0 with gzip/xz/zstd/lzo/lz4 blocks and fragments. Read and format."
  - name: uefi
    kind: driver
    ci: true
    desc: "EFI System Partition (FAT-based) plus the OVMF/EDK2 NvVar variable store with time-based authenticated writes. Read, write, format."
  - name: ufs
    kind: driver
    ci: true
    desc: "Unix File System (BSD) — UFS2 (FreeBSD 14.x) read+write, UFS1 read. Read, write, format, symlinks."
  - name: ffs
    kind: driver
    ci: true
    desc: "NetBSD/OpenBSD FFSv1/FFSv2 alias module over the ufs driver. Read, write, format."
  - name: xfs
    kind: driver
    ci: true
    desc: "High-performance journaling filesystem — XFS v5 (CRC32c, ftype). Read, write, format, symlinks, reflink/quotas and grow/resize."
  - name: zfs
    kind: driver
    ci: true
    desc: "Copy-on-write pooled storage filesystem — single pool, single vdev writer (multi-vdev/RAID-Z read-only). Read, write, format, snapshots/clones and grow/shrink."
  - name: cab
    kind: driver
    ci: true
    desc: "Microsoft Cabinet (<code>.cab</code>), read as a filesystem — no cgo."
  - name: rar
    kind: driver
    ci: true
    desc: "RAR read as a filesystem, including multi-volume sets."
  - name: rpm
    kind: driver
    ci: true
    desc: "RPM packages — the lead, the signature and header regions, and the payload."
  - name: sevenzip
    kind: driver
    ci: true
    desc: "7z through <code>bodgit/sevenzip</code>, and it <strong>writes</strong> — the container and the entries."
  - name: warc
    kind: driver
    ci: true
    desc: "WARC, the ISO 28500 web archive format — reader <strong>and</strong> writer."
  - name: unarchive
    kind: tool
    ci: true
    desc: "Extract any archive, everywhere Go compiles: the format is sniffed from the bytes, not the extension, and volumes are followed."
  - name: smb
    kind: tool
    ci: true
    desc: "SMB2 server exporting any <code>Filesystem</code> — mountable on Windows, macOS and Linux."
  - name: s3
    kind: tool
    ci: true
    desc: "An S3-compatible object API over any driver here."
  - name: overlay
    kind: tool
    ci: true
    desc: "Makes a read-only filesystem writable: changes land in a spool, cheaply, and one rewrite happens when you say so."
  - name: xar
    kind: driver
    ci: true
    desc: "XAR, the macOS <code>.pkg</code> installer format: a gzip'd XML table of contents and a heap."
