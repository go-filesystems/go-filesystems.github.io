# Does this organisation advertise what it has?
#
# The logic lives once, in go-fleettools; this calls it. No secret: listing a
# public organisation is a public read.
#
# ⛔ data/fs.yaml opens with "One card per real, non-fork repo in the
# go-filesystems org". That sentence was there while nine repositories were on
# no page at all. This is what makes it true instead of hopeful.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  # ⛔ A PUSH TO THIS REPOSITORY IS THE WRONG EVENT TO WATCH. The thing that
  # makes the list wrong is a repository appearing in the ORGANISATION, which
  # never touches this one. osfs was created 2026-09-29; this workflow last ran
  # 2026-09-26 and was green; the page was five days out of date and nothing
  # said so. A schedule is what notices.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  current:
    uses: go-fleettools/fleettools/.github/workflows/docs-current.yml@main
