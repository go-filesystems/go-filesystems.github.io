baseURL = "https://go-filesystems.github.io/"
# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[languages.en]
  weight = 1
title = "go-filesystems"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

[params]

# The architectures the drivers' tests RUN on (ext4 ci.yml: native amd64 and
# arm64 lanes, qemu lanes for riscv64, loong64, ppc64le and s390x).
[params.mantra]
  goarch = ["amd64", "arm64", "riscv64", "loong64", "ppc64le", "s390x"]

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-filesystems.github.io/docs/"
  label = "Documentation"
[[params.cta]]
  kind  = "try"
  href  = "https://go-filesystems.github.io/playground/"
  label = "Try it in your browser"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-filesystems"
  label = "GitHub"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"
